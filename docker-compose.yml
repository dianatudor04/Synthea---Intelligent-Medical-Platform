# ─────────────────────────────────────────────────────────────────────────────
#  Synthea — Docker Compose
#
#  Two ways to run:
#
#  1) Dev (recommended): only the backing services run in Docker; the backend,
#     worker, and frontend run on the host with hot-reload.
#         docker compose up -d            # postgres, redis, rustfs, mailpit
#         make dev                         # or run the three dev servers yourself
#
#  2) Full stack in Docker: everything, built as production images.
#         docker compose --profile full up -d --build
#
#  The backend/worker/frontend live under the "full" profile, so a plain
#  `docker compose up` brings up infrastructure only.
# ─────────────────────────────────────────────────────────────────────────────

services:
  # ─── PostgreSQL Database (with pgvector) ──────────────────
  postgres:
    image: pgvector/pgvector:pg16
    container_name: synthea_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: synthea_user
      POSTGRES_PASSWORD: synthea_pass
      POSTGRES_DB: synthea_db
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U synthea_user -d synthea_db']
      interval: 10s
      timeout: 5s
      retries: 5

  # ─── RustFS Object Storage (S3-compatible) ────────────────
  rustfs:
    image: rustfs/rustfs:latest
    container_name: synthea_rustfs
    restart: unless-stopped
    environment:
      RUSTFS_ACCESS_KEY: ${RUSTFS_ACCESS_KEY:-synthea_rustfs_access}
      RUSTFS_SECRET_KEY: ${RUSTFS_SECRET_KEY:-synthea_rustfs_secret}
      RUSTFS_VOLUMES: /data
      RUSTFS_CONSOLE_ENABLE: 'true'
    ports:
      - '9000:9000'   # S3 API
      - '9001:9001'   # web console
    volumes:
      - rustfs_data:/data
    healthcheck:
      # RustFS exposes /health (the MinIO-style /minio/health/live path 403s here).
      test: ['CMD-SHELL', 'curl -fsS http://localhost:9000/health || exit 1']
      interval: 10s
      timeout: 5s
      retries: 5

  # ─── Redis (BullMQ job queue backend) ─────────────────────
  redis:
    image: redis:7-alpine
    container_name: synthea_redis
    restart: unless-stopped
    command: ['redis-server', '--appendonly', 'yes']
    ports:
      - '6379:6379'
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5

  # ─── Mailpit (dev SMTP sink + web UI) ─────────────────────
  mailpit:
    image: axllent/mailpit:latest
    container_name: synthea_mailpit
    restart: unless-stopped
    ports:
      - '1025:1025'   # SMTP
      - '8025:8025'   # web UI
    environment:
      MP_MAX_MESSAGES: 500
      MP_SMTP_AUTH_ACCEPT_ANY: 'true'
      MP_SMTP_AUTH_ALLOW_INSECURE: 'true'

  # ─── Backend API ──────────────────────────────────────────
  backend:
    profiles: ['full']
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: synthea_backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      rustfs:
        condition: service_started
      redis:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 5000
      DATABASE_URL: postgresql://synthea_user:synthea_pass@postgres:5432/synthea_db
      REDIS_URL: redis://redis:6379
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-openai/text-embedding-3-small}
      SMTP_HOST: ${SMTP_HOST:-mailpit}
      SMTP_PORT: ${SMTP_PORT:-1025}
      SMTP_FROM: ${SMTP_FROM:-Synthea <no-reply@synthea.local>}
      APP_PUBLIC_URL: ${APP_PUBLIC_URL:-http://localhost:3000}
      API_PUBLIC_URL: ${API_PUBLIC_URL:-http://localhost:5000}
      EMAIL_MARKETING_ENABLED: ${EMAIL_MARKETING_ENABLED:-true}
      JWT_SECRET: ${JWT_SECRET}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET}
      FRONTEND_URL: http://localhost:3000
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY}
      RUSTFS_ENDPOINT: http://rustfs:9000
      RUSTFS_ACCESS_KEY: ${RUSTFS_ACCESS_KEY:-synthea_rustfs_access}
      RUSTFS_SECRET_KEY: ${RUSTFS_SECRET_KEY:-synthea_rustfs_secret}
      RUSTFS_BUCKET: ${RUSTFS_BUCKET:-synthea-patient-uploads}
      RUSTFS_REGION: ${RUSTFS_REGION:-us-east-1}
      RUSTFS_PUBLIC_ENDPOINT: ${RUSTFS_PUBLIC_ENDPOINT:-http://localhost:9000}
      MAX_FILE_SIZE_MB: ${MAX_FILE_SIZE_MB:-1024}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY}
      OPENROUTER_MODEL: ${OPENROUTER_MODEL:-openai/gpt-4o-mini}
      OPENROUTER_REFERER: ${OPENROUTER_REFERER:-http://localhost:3000}
      OPENROUTER_TITLE: ${OPENROUTER_TITLE:-Synthea Medical Platform}
    ports:
      - '5000:5000'
    volumes:
      - ./backend/logs:/app/logs
    healthcheck:
      test: ['CMD-SHELL', 'wget -qO- http://localhost:5000/health || exit 1']
      interval: 15s
      timeout: 5s
      retries: 5

  # ─── Worker (BullMQ job processors) ───────────────────────
  worker:
    profiles: ['full']
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: synthea_worker
    restart: unless-stopped
    command: ['node', 'dist/workers/index.js']
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rustfs:
        condition: service_started
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://synthea_user:synthea_pass@postgres:5432/synthea_db
      REDIS_URL: redis://redis:6379
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-openai/text-embedding-3-small}
      SMTP_HOST: ${SMTP_HOST:-mailpit}
      SMTP_PORT: ${SMTP_PORT:-1025}
      SMTP_FROM: ${SMTP_FROM:-Synthea <no-reply@synthea.local>}
      APP_PUBLIC_URL: ${APP_PUBLIC_URL:-http://localhost:3000}
      API_PUBLIC_URL: ${API_PUBLIC_URL:-http://localhost:5000}
      JWT_SECRET: ${JWT_SECRET}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET}
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY}
      OPENROUTER_MODEL: ${OPENROUTER_MODEL:-openai/gpt-4o-mini}
      RUSTFS_ENDPOINT: http://rustfs:9000
      RUSTFS_ACCESS_KEY: ${RUSTFS_ACCESS_KEY:-synthea_rustfs_access}
      RUSTFS_SECRET_KEY: ${RUSTFS_SECRET_KEY:-synthea_rustfs_secret}
      RUSTFS_BUCKET: ${RUSTFS_BUCKET:-synthea-patient-uploads}
      RUSTFS_REGION: ${RUSTFS_REGION:-us-east-1}

  # ─── Frontend (Vite SPA, served by nginx) ─────────────────
  frontend:
    profiles: ['full']
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        # Vite inlines this at build time; point the browser at the host API port.
        VITE_API_URL: ${VITE_API_URL:-http://localhost:5000/api}
    container_name: synthea_frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - '3000:3000'

volumes:
  postgres_data:
    driver: local
  rustfs_data:
    driver: local
  redis_data:
    driver: local
