version: '3.9'

services:
  # ─── PostgreSQL Database ──────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: synthea_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: synthea_user
      POSTGRES_PASSWORD: synthea_pass
      POSTGRES_DB: synthea_db
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U synthea_user -d synthea_db']
      interval: 10s
      timeout: 5s
      retries: 5

  # ─── RustFS Object Storage (S3-compatible) ────────────────
  rustfs:
    image: rustfs/rustfs:latest
    container_name: synthea_rustfs
    restart: unless-stopped
    environment:
      RUSTFS_ACCESS_KEY: ${RUSTFS_ACCESS_KEY:-synthea_rustfs_access}
      RUSTFS_SECRET_KEY: ${RUSTFS_SECRET_KEY:-synthea_rustfs_secret}
      RUSTFS_VOLUMES: /data
      RUSTFS_CONSOLE_ENABLE: 'true'
    ports:
      - '9000:9000'   # S3 API
      - '9001:9001'   # web console
    volumes:
      - rustfs_data:/data
    healthcheck:
      test: ['CMD-SHELL', 'curl -fsS http://localhost:9000/minio/health/live || exit 1']
      interval: 10s
      timeout: 5s
      retries: 5

  # ─── Backend API ──────────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: synthea_backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      rustfs:
        condition: service_started
    environment:
      NODE_ENV: production
      PORT: 5000
      DATABASE_URL: postgresql://synthea_user:synthea_pass@postgres:5432/synthea_db
      JWT_SECRET: ${JWT_SECRET}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET}
      FRONTEND_URL: http://localhost:3000
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY}
      RUSTFS_ENDPOINT: http://rustfs:9000
      RUSTFS_ACCESS_KEY: ${RUSTFS_ACCESS_KEY:-synthea_rustfs_access}
      RUSTFS_SECRET_KEY: ${RUSTFS_SECRET_KEY:-synthea_rustfs_secret}
      RUSTFS_BUCKET: ${RUSTFS_BUCKET:-synthea-patient-uploads}
      RUSTFS_REGION: ${RUSTFS_REGION:-us-east-1}
      RUSTFS_PUBLIC_ENDPOINT: ${RUSTFS_PUBLIC_ENDPOINT:-http://localhost:9000}
      MAX_FILE_SIZE_MB: ${MAX_FILE_SIZE_MB:-1024}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY}
      OPENROUTER_MODEL: ${OPENROUTER_MODEL:-google/gemini-2.0-flash-001}
      OPENROUTER_REFERER: ${OPENROUTER_REFERER:-http://localhost:3000}
      OPENROUTER_TITLE: ${OPENROUTER_TITLE:-Synthea Medical Platform}
    ports:
      - '5000:5000'
    volumes:
      - ./backend/logs:/app/logs

  # ─── Frontend (Next.js) ───────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: synthea_frontend
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:5000/api
    ports:
      - '3000:3000'

volumes:
  postgres_data:
    driver: local
  rustfs_data:
    driver: local
